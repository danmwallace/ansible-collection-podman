---
argument_specs:
  main:
    short_description: Deploy Arcane container management UI and Postgres as Podman Quadlet units on Fedora.
    options:
      arcane_version:
        type: str
        default: v3.1.1
        description:
          - Image tag for ghcr.io/getarcaneapp/manager. Must be v3.0.0 or newer; the role renders a 3.x-only Quadlet unit.
          - Upgrading from 2.x requires running v2.17.3 once first (see the README).
      arcane_socket_proxy_version:
        type: str
        default: "3.4@sha256:027f9fa5ee70be5836eeaa10ce889d7a83f34a8db16a7f412818b92997e0beab"
        description:
          - Image reference after ghcr.io/tecnativa/docker-socket-proxy for the sidecar that mediates Arcane's access to the Podman socket.
          - Either a tag, or a tag plus its digest (tag@sha256:...). The default pins the floating 3.4 tag to its multi-arch index digest.
      arcane_hostname:
        type: str
        required: true
        description: Public hostname for Arcane (e.g. arcane.example.com). Used for ARCANE_APP_URL and the Traefik routing rule.
      arcane_data_dir:
        type: str
        default: /opt/podman/arcane
        description: >-
          Host directory for Arcane persistent data. Postgres data is stored under a postgres/
          subdirectory, created 0700 with ownership left to the container (the image's postgres
          user, uid 999); the base directory is 0755. The base directory also holds arcane.env and
          arcane-postgres.env, the 0600 root-owned files that carry the encryption key and the
          Postgres password.
      arcane_app_data_dir:
        type: str
        default: "{{ arcane_data_dir }}/data"
        description:
          - Host directory bind-mounted at /app/data in the Arcane container (projects/, templates/ and Arcane's local state).
          - Owned by 1000:1000, the PUID/PGID Arcane runs as.
          - Without it, /app/data is the image's anonymous volume, which Quadlet's --rm deletes on every restart.
      arcane_postgres_db:
        type: str
        default: arcane
        description: Name of the Postgres database created for Arcane.
      arcane_postgres_user:
        type: str
        default: arcane
        description: Postgres username Arcane connects with.
      arcane_postgres_password:
        type: str
        required: true
        no_log: true
        description: Postgres password for arcane_postgres_user. Store in Ansible Vault.
      arcane_encryption_key:
        type: str
        required: true
        no_log: true
        description:
          - Encryption key used by Arcane for at-rest secret encryption (ARCANE_ENCRYPTION_KEY). Store in Ansible Vault.
          - "At least 32 characters, or a hex: or base64: encoded 32-byte key; Arcane 3.x refuses shorter passphrases."
          - Keep the value used under 2.x, or Arcane cannot decrypt its stored secrets.
      arcane_jwt_secret:
        type: str
        required: false
        default: ""
        no_log: true
        description:
          - Deprecated and ignored. Arcane 3.x signs sessions with its own key and no longer reads JWT_SECRET.
          - Accepted so existing inventories keep working; it will be removed in a later major release.
