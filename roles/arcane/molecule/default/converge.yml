---
- name: Converge
  hosts: molecule
  gather_facts: true
  tasks:
    - name: Apply arcane role with test values
      ansible.builtin.include_role:
        name: danmwallace.podman.arcane
      vars:
        arcane_hostname: arcane.test.local
        arcane_postgres_password: test-pass  # molecule-test-only: fake value, not a real credential
        arcane_encryption_key: test-encryption-key-not-for-production  # molecule-test-only: fake value, not a real credential
        # Deprecated and ignored since 3.x; set here to prove old inventories still pass (verify checks it is not rendered).
        arcane_jwt_secret: test-secret  # molecule-test-only: fake value, not a real credential
