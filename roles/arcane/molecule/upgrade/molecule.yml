---
# Runs the three Quadlet units for real (rootful Podman inside the instance) to
# prove that a version bump or config change starts each container exactly
# once, in dependency order (#77). The default scenario only checks the
# rendered files.
#
# Keep this run out of the owner's ~/.ansible; see .config/molecule/collections.yml.
prerun: false
dependency:
  name: galaxy
  options:
    force: true
    collections-path: ${MOLECULE_EPHEMERAL_DIRECTORY}/ansible_home/collections
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/../../.config/molecule/collections.yml
ansible:
  env:
    ANSIBLE_HOME: ${MOLECULE_EPHEMERAL_DIRECTORY}/ansible_home
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_EPHEMERAL_DIRECTORY}/ansible_home/collections:${HOME}/.ansible/collections:/usr/share/ansible/collections
provisioner:
  name: ansible
  # The systemd tasks are tagged molecule-notest for the default scenario, where
  # no units run. Here they are the point of the test, so only `notest` is skipped.
  options:
    skip-tags: notest
  inventory:
    hosts:
      molecule:
        hosts:
          podman-arcane-upgrade-instance:
            ansible_connection: containers.podman.podman
scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
