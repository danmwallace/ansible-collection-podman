---
- name: Assert required arcane secrets are configured
  ansible.builtin.assert:
    that:
      - arcane_postgres_password | length > 0
      - arcane_encryption_key | length > 0
      - arcane_jwt_secret | length > 0
    fail_msg: >
      arcane_postgres_password, arcane_encryption_key, and arcane_jwt_secret
      must all be set (use Ansible Vault).
  no_log: true

- name: Ensure arcane base data directory exists
  ansible.builtin.file:
    path: "{{ arcane_data_dir }}"
    state: directory
    mode: "0755"
  become: true

# The official postgres image entrypoint runs `chmod 00700 "$PGDATA"` on every
# start, so anything but 0700 here flips back each run. Ownership is deliberately
# not managed: initdb chowns the directory to the image's postgres user (uid 999).
- name: Ensure arcane postgres data directory exists
  ansible.builtin.file:
    path: "{{ arcane_data_dir }}/postgres"
    state: directory
    mode: "0700"
  become: true

- name: Deploy arcane Quadlet network unit
  ansible.builtin.copy:
    content: |
      [Network]
      Label=managed_by=ansible
    dest: /etc/containers/systemd/arcane.network
    mode: "0644"
  become: true

- name: Deploy arcane-socket Quadlet network unit
  ansible.builtin.copy:
    content: |
      [Network]
      Internal=true
      Label=managed_by=ansible
    dest: /etc/containers/systemd/arcane-socket.network
    mode: "0644"
  become: true

- name: Deploy arcane-postgres Quadlet container unit
  ansible.builtin.template:
    src: arcane-postgres.container.j2
    dest: /etc/containers/systemd/arcane-postgres.container
    mode: "0644"
  become: true
  notify: Restart arcane-postgres

- name: Deploy arcane-socket-proxy Quadlet container unit
  ansible.builtin.template:
    src: arcane-socket-proxy.container.j2
    dest: /etc/containers/systemd/arcane-socket-proxy.container
    mode: "0644"
  become: true
  notify: Restart arcane-socket-proxy

- name: Deploy arcane Quadlet container unit
  ansible.builtin.template:
    src: arcane.container.j2
    dest: /etc/containers/systemd/arcane.container
    mode: "0644"
  become: true
  notify: Restart arcane

- name: Enable and start arcane-postgres.service
  ansible.builtin.systemd:
    name: arcane-postgres.service
    enabled: true
    state: started
    daemon_reload: true
  become: true
  tags: [molecule-notest]

- name: Enable and start arcane-socket-proxy.service
  ansible.builtin.systemd:
    name: arcane-socket-proxy.service
    enabled: true
    state: started
    daemon_reload: true
  become: true
  tags: [molecule-notest]

- name: Enable and start arcane.service
  ansible.builtin.systemd:
    name: arcane.service
    enabled: true
    state: started
  become: true
  tags: [molecule-notest]
