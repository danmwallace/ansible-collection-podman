# SPDX-License-Identifier: MIT
---
- name: Assert arcane_version is a 3.x release
  ansible.builtin.assert:
    that:
      - arcane_version | regex_replace('^v', '') is version('3.0.0', '>=')
    # A 2.x image would ignore every ARCANE_ name and start on an empty SQLite DB.
    fail_msg: >-
      arcane_version {{ arcane_version }} is older than v3.0.0. This role renders a
      3.x-only Quadlet unit; use collection 0.6.x to run Arcane 2.x.

- name: Assert required arcane secrets are configured
  ansible.builtin.assert:
    that:
      - arcane_postgres_password | length > 0
      # Arcane 3.x refuses a passphrase under 32 characters in production.
      - >-
        arcane_encryption_key is match('^(hex|base64):')
        or (arcane_encryption_key | regex_replace('^raw:', '') | length >= 32)
    fail_msg: >-
      arcane_postgres_password must be set, and arcane_encryption_key must be at
      least 32 characters (or a hex:/base64: encoded 32-byte key); use Ansible Vault.
  no_log: true

- name: Ensure arcane base data directory exists
  ansible.builtin.file:
    path: "{{ arcane_data_dir }}"
    state: directory
    mode: "0755"
  become: true

# The official postgres image entrypoint runs `chmod 00700 "$PGDATA"` on every
# start, so anything but 0700 here flips back each run. Ownership is deliberately
# not managed: initdb chowns the directory to the image's postgres user (uid 999).
- name: Ensure arcane postgres data directory exists
  ansible.builtin.file:
    path: "{{ arcane_data_dir }}/postgres"
    state: directory
    mode: "0700"
  become: true

# Arcane starts as root and drops to PUID:PGID, so that user must own /app/data
# (Arcane also chowns it on start). 0700: compose projects and their .env files
# live here, and Arcane keeps the mode.
- name: Ensure arcane app data directory exists
  ansible.builtin.file:
    path: "{{ arcane_app_data_dir }}"
    state: directory
    owner: "{{ arcane_puid }}"
    group: "{{ arcane_pgid }}"
    mode: "0700"
  become: true

# Secrets live here, not in Environment= lines: Quadlet copies those into the
# generated /run/systemd/generator/*.service, which any local user can read.
- name: Deploy arcane-postgres environment file
  ansible.builtin.template:
    src: arcane-postgres.env.j2
    dest: "{{ arcane_data_dir }}/arcane-postgres.env"
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  register: arcane_postgres_env_file

- name: Deploy arcane environment file
  ansible.builtin.template:
    src: arcane.env.j2
    dest: "{{ arcane_data_dir }}/arcane.env"
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  register: arcane_env_file

- name: Deploy arcane Quadlet network unit
  ansible.builtin.copy:
    content: |
      [Network]
      Label=managed_by=ansible
    dest: /etc/containers/systemd/arcane.network
    mode: "0644"
  become: true

- name: Deploy arcane-socket Quadlet network unit
  ansible.builtin.copy:
    content: |
      [Network]
      Internal=true
      Label=managed_by=ansible
    dest: /etc/containers/systemd/arcane-socket.network
    mode: "0644"
  become: true

- name: Deploy arcane-postgres Quadlet container unit
  ansible.builtin.template:
    src: arcane-postgres.container.j2
    dest: /etc/containers/systemd/arcane-postgres.container
    mode: "0644"
  become: true
  register: arcane_postgres_unit

- name: Deploy arcane-socket-proxy Quadlet container unit
  ansible.builtin.template:
    src: arcane-socket-proxy.container.j2
    dest: /etc/containers/systemd/arcane-socket-proxy.container
    mode: "0644"
  become: true
  register: arcane_socket_proxy_unit

- name: Deploy arcane Quadlet container unit
  ansible.builtin.template:
    src: arcane.container.j2
    dest: /etc/containers/systemd/arcane.container
    mode: "0644"
  become: true
  register: arcane_unit

# Start and restart in dependency order, each unit at most once per run (#77).
# Handlers ran postgres -> arcane -> socket-proxy, and because arcane.container
# has Requires=arcane-socket-proxy.service, restarting the proxy restarted
# Arcane a second time. Each unit is restarted below only if its own files
# changed and the start task did not just start it on the new config. A proxy
# restart already restarts Arcane through Requires=, so Arcane's own restart is
# skipped then. Arcane is never started before Postgres accepts connections.
- name: Enable and start arcane-postgres.service
  ansible.builtin.systemd:
    name: arcane-postgres.service
    enabled: true
    state: started
    daemon_reload: true
  become: true
  register: arcane_postgres_started
  tags: [molecule-notest]

- name: Ensure arcane-postgres.service runs its changed config
  ansible.builtin.systemd:
    name: arcane-postgres.service
    state: restarted
  become: true
  when:
    - arcane_postgres_env_file is changed or arcane_postgres_unit is changed
    - arcane_postgres_started is not changed
  tags: [molecule-notest]

# TCP, not the Unix socket: during first-run initdb the entrypoint's temporary
# server listens only on the socket, so a socket check would pass too early.
- name: Ensure arcane-postgres accepts connections before Arcane starts
  containers.podman.podman_container_exec:
    name: arcane-postgres
    argv:
      - pg_isready
      - --host=127.0.0.1
      - --port=5432
      - --username={{ arcane_postgres_user }}
      - --dbname={{ arcane_postgres_db }}
  become: true
  register: arcane_postgres_ready
  until: arcane_postgres_ready.rc | default(1) == 0
  retries: 30
  delay: 2
  changed_when: false
  when: not ansible_check_mode
  tags: [molecule-notest]

- name: Enable and start arcane-socket-proxy.service
  ansible.builtin.systemd:
    name: arcane-socket-proxy.service
    enabled: true
    state: started
    daemon_reload: true
  become: true
  register: arcane_socket_proxy_started
  tags: [molecule-notest]

# Requires= makes systemd restart a running arcane.service along with the proxy.
- name: Ensure arcane-socket-proxy.service (and with it arcane.service) runs its changed config
  ansible.builtin.systemd:
    name: arcane-socket-proxy.service
    state: restarted
  become: true
  register: arcane_socket_proxy_restarted
  when:
    - arcane_socket_proxy_unit is changed
    - arcane_socket_proxy_started is not changed
  tags: [molecule-notest]

- name: Enable and start arcane.service
  ansible.builtin.systemd:
    name: arcane.service
    enabled: true
    state: started
  become: true
  register: arcane_started
  tags: [molecule-notest]

- name: Ensure arcane.service runs its changed config
  ansible.builtin.systemd:
    name: arcane.service
    state: restarted
  become: true
  when:
    - arcane_env_file is changed or arcane_unit is changed
    - arcane_started is not changed
    - arcane_socket_proxy_restarted is skipped
  tags: [molecule-notest]
