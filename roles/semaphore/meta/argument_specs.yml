---
argument_specs:
  main:
    short_description: Deploy Semaphore Ansible UI with Postgres as Podman Quadlets on Fedora.
    options:
      semaphore_version:
        type: str
        default: v2.19.12
        description: Semaphore image tag (e.g. v2.19.12).
      semaphore_hostname:
        type: str
        required: true
        description: Hostname for the Semaphore web interface (e.g. semaphore.example.com).
      semaphore_data_dir:
        type: str
        default: /opt/podman/semaphore
        description: >-
          Host base directory for Semaphore data, config, and Postgres volumes. The postgres/
          subdirectory is created 0700 and its ownership is left to the container (the image's
          postgres user, uid 999); the other directories are 0755.
      semaphore_postgres_db:
        type: str
        default: semaphore
        description: Name of the Postgres database for Semaphore.
      semaphore_postgres_user:
        type: str
        default: semaphore
        description: Postgres username for Semaphore.
      semaphore_postgres_password:
        type: str
        required: true
        no_log: true
        description: Postgres password for Semaphore. Must not be empty. Store in Ansible Vault.
      semaphore_admin:
        type: str
        default: admin
        description: Semaphore admin username.
      semaphore_admin_password:
        type: str
        required: true
        no_log: true
        description: Semaphore admin password. Must not be empty. Store in Ansible Vault.
      semaphore_admin_name:
        type: str
        default: Admin
        description: Display name for the Semaphore admin user.
      semaphore_admin_email:
        type: str
        default: admin@example.com
        description: Email address for the Semaphore admin user.
      semaphore_access_key_encryption:
        type: str
        required: true
        no_log: true
        description: Encryption key for Semaphore stored credentials (SEMAPHORE_ACCESS_KEY_ENCRYPTION). Must not be empty. Store in Ansible Vault.
      semaphore_cookie_hash:
        type: str
        required: true
        no_log: true
        description: HMAC key for Semaphore session cookies (SEMAPHORE_COOKIE_HASH). Generate with openssl rand -hex 32. Store in Ansible Vault.
      semaphore_cookie_encryption:
        type: str
        required: true
        no_log: true
        description: Encryption key for Semaphore session cookies (SEMAPHORE_COOKIE_ENCRYPTION). Generate with openssl rand -base64 32. Store in Ansible Vault.
      semaphore_tmp_path:
        type: str
        default: /tmp/semaphore
        description: >-
          Path inside the container where Semaphore keeps temporary files such as cloned
          repositories. Rendered as SEMAPHORE_TMP_PATH (config key tmp_path).
      semaphore_playbook_path:
        type: str
        required: false
        description: >-
          Deprecated alias for semaphore_tmp_path, honoured when set. Releases before 0.6.2
          rendered it as SEMAPHORE_PLAYBOOK_PATH, which Semaphore never reads.
      semaphore_ansible_host_key_checking:
        type: str
        default: "False"
        description: Value for ANSIBLE_HOST_KEY_CHECKING in the Semaphore container environment.
