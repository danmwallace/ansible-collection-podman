---
- name: Ensure grimmory data directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "0755"
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
  loop:
    - path: "{{ grimmory_data_dir }}"
      owner: root
    - path: "{{ grimmory_data_dir }}/data"
      owner: "{{ grimmory_app_uid }}"
    - path: "{{ grimmory_data_dir }}/books"
      owner: "{{ grimmory_app_uid }}"
    - path: "{{ grimmory_data_dir }}/bookdrop"
      owner: "{{ grimmory_app_uid }}"
  become: true

# The mariadb image entrypoint chowns its data dir to the image's mysql user on
# every start. Ownership is left to the container by default so no uid is baked
# into the role; set grimmory_db_uid only to pin it explicitly.
- name: Ensure grimmory MariaDB data directory exists
  ansible.builtin.file:
    path: "{{ grimmory_data_dir }}/db"
    state: directory
    mode: "0755"
    owner: "{{ grimmory_db_uid | default(omit) }}"
    group: "{{ grimmory_db_uid | default(omit) }}"
  become: true

- name: Ensure nfs-utils is installed
  ansible.builtin.package:
    name: nfs-utils
    state: present
  become: true

- name: Ensure NFS mount point exists
  ansible.builtin.file:
    path: "{{ grimmory_nfs_mountpoint }}"
    state: directory
    mode: "0755"
  become: true

- name: Mount NFS books share
  ansible.posix.mount:
    src: "{{ grimmory_nfs_server }}:{{ grimmory_nfs_path }}"
    path: "{{ grimmory_nfs_mountpoint }}"
    fstype: nfs4
    opts: defaults,_netdev,nofail
    state: mounted
  become: true
  tags: [molecule-notest]

- name: Deploy grimmory Quadlet network unit
  ansible.builtin.copy:
    content: |
      [Network]
      Label=managed_by=ansible
    dest: /etc/containers/systemd/grimmory.network
    mode: "0644"
  become: true

- name: Deploy grimmory-db Quadlet container unit
  ansible.builtin.template:
    src: grimmory-db.container.j2
    dest: /etc/containers/systemd/grimmory-db.container
    mode: "0644"
  become: true
  notify: Restart grimmory-db

- name: Enable and start grimmory-db.service
  ansible.builtin.systemd:
    name: grimmory-db.service
    enabled: true
    state: started
    daemon_reload: true
  become: true
  tags: [molecule-notest]

- name: Deploy grimmory Quadlet container unit
  ansible.builtin.template:
    src: grimmory.container.j2
    dest: /etc/containers/systemd/grimmory.container
    mode: "0644"
  become: true
  notify: Restart grimmory

- name: Enable and start grimmory.service
  ansible.builtin.systemd:
    name: grimmory.service
    enabled: true
    state: started
    daemon_reload: true
  become: true
  tags: [molecule-notest]
